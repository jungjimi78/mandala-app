<!doctype html><html lang="ko"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>나의 만다라트</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f7f3ff"><link rel="stylesheet" href="./style.css?v=6"></head>
<body><div class="app"><header class="topbar"><div><small>MY LIFE MANDALA</small><h1>나의 만다라트</h1></div><button id="focusBtn" class="focusBtn">⭐ Focus 8</button></header><main>
<section id="homeView" class="view active"><div id="fullGrid" class="fullGrid"></div><section class="activityCard"><div class="activityTitle"><div><small>TODAY</small><h3>오늘의 기록</h3></div><strong id="todayCount">0</strong></div><div id="todaySummary" class="summaryChips"></div><div id="todayRecent" class="recentList"></div></section></section>
<section id="categoryView" class="view"><button class="back" data-back="homeView">← 전체 만다라트</button><h2 id="categoryTitle"></h2><div id="categoryGrid" class="categoryGrid"></div><section class="activityCard categoryActivity"><div class="activityTitle"><div><small id="categoryMonthLabel">THIS MONTH</small><h3>이번 달 기록</h3></div><strong id="categoryCount">0</strong></div><div id="categorySummary" class="summaryChips"></div><div id="categoryRecent" class="recentList"></div></section></section>
<section id="taskView" class="view"><button class="back" data-back="categoryView">← 영역으로</button><div class="taskHead"><div><small id="taskCategory"></small><h2 id="taskTitle"></h2></div><button id="editTaskBtn" class="mini">수정</button></div><div class="goalRow"><span>기준</span><select id="frequency"><option value="daily">매일</option><option value="weekly1">주 1회</option><option value="weekly2">주 2회</option><option value="weekly3">주 3회</option><option value="monthly1">월 1회</option><option value="project">필요할 때</option></select></div><section class="calendarCard"><div class="monthNav"><button id="prevMonth">‹</button><b id="monthLabel"></b><button id="nextMonth">›</button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div><div class="rate"><span>이달 달성률</span><strong id="rateText">0%</strong></div><div class="rateBar"><div id="rateFill"></div></div><p id="rateDetail" class="rateDetail"></p></section><section class="noteCard"><div class="noteHead"><b>한 줄 메모</b><span id="noteDate"></span></div><textarea id="dailyNote" rows="3" maxlength="180" placeholder="오늘 한 일을 짧게 남겨봐."></textarea><button id="saveNoteBtn" class="noteSave">저장</button><div id="noteList" class="noteList"></div></section></section>
<section id="focusView" class="view"><button class="back" data-back="homeView">← 만다라트</button><h2>⭐ 이번 달 집중 8개</h2><p class="sub">8개 영역에서 실천과제를 하나씩 골라. 영역마다 딱 하나씩 선택할 수 있어.</p><div id="focusList" class="focusList"></div><button id="chooseFocus" class="primary">집중 목표 선택·변경</button><div id="focusPicker" class="picker hidden"></div></section>
</main></div><script src="./app.js?v=7" defer></script></body></html>
